[project]
name = "py-understat"
version = "0.1.0"
description = "An asynchronous client for Understat football statistics"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
